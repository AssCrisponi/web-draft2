site_name: Associazione Sindrome di Crisponi e Malattie Rare ODV
site_url: https://www.sindromedicrisponi.it

theme:
  name: material
  custom_dir: overrides
  sidebar: true
  palette:
    primary: black
    accent: white
  logo: assets/images/logo_scontornato.png
  favicon: images/favicon.ico
  icon:
    repo: fontawesome/brands/git-alt
  language: it
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    # - content.code.select
    # - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    # - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    # - navigation.prune
    - navigation.sections
    - navigation.tabs
#    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.path
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
#    - toc.integrate

plugins:
  - blog:
      blog_dir: blog
      categories_toc: true
      blog_toc: true
  - meta
  - search
  - tags


nav:
  - Home: index.md
  - La sindrome:
    - La sindrome: la_sindrome.md
    - Pubblicazioni Scientifiche: pubblicazioni_scientifiche.md
  - L'associazione:
      - Chi siamo: chi_siamo.md
      - 5x1000: 5x1000.md
  - Blog:
      - blog/index.md

copyright: © Associazione Sindrome di Crisponi e Malattie Rare ODV

extra:
  social:
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/sindromedicrisponi

extra_css:
  - assets/css/manutenzione.css
  - assets/css/extra.css
